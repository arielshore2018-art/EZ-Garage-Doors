    - generic [ref=e215]:
      - generic [ref=e216]:
        - paragraph [ref=e217]: Season by season
        - heading "A chimney has a calendar" [level=2] [ref=e218]
      - generic [ref=e219]:
        - article [ref=e220]:
          - generic [ref=e221]: Sep – Nov
          - heading "Fall — inspect before the first fire" [level=3] [ref=e222]
          - paragraph [ref=e223]: The busiest season. Book the inspection before heavy use starts, while calendars are still open.
        - article [ref=e224]:
          - generic [ref=e225]: Dec – Feb
          - heading "Winter — burn season" [level=3] [ref=e226]
          - paragraph [ref=e227]: Seasoned hardwood, a working damper, and attention to smoke smells. Cleaning matters most when the fireplace works hardest.
        - article [ref=e228]:
          - generic [ref=e229]: Mar – May
          - heading "Spring — check what winter did" [level=3] [ref=e230]
          - paragraph [ref=e231]: Freeze-thaw cycles crack crowns and open mortar joints. Water stains near the chimney usually show up now.
        - article [ref=e232]:
          - generic [ref=e233]: Jun – Aug NOW
          - heading "Summer — the repair window" [level=3] [ref=e234]
          - paragraph [ref=e235]: Warm, dry weather is the right time for masonry work, waterproofing, and anything the spring check turned up.
    - generic [ref=e237]:
      - generic [ref=e238]:
        - paragraph [ref=e239]: FAQ
        - heading "Common questions" [level=2] [ref=e240]
      - generic [ref=e241]:
        - generic [ref=e242]:
          - button "How often should I have my chimney inspected? +" [ref=e243] [cursor=pointer]:
            - text: How often should I have my chimney inspected?
            - generic [ref=e244]: +
          - generic:
            - paragraph: The National Fire Protection Association recommends annual chimney inspections. Even if you don't use your fireplace often, animals, moisture, and settling can cause issues that go unnoticed without a professional inspection.
        - generic [ref=e245]:
          - button "How do I book an appointment? +" [ref=e246] [cursor=pointer]:
            - text: How do I book an appointment?
            - generic [ref=e247]: +
          - generic:
            - paragraph: Use our online scheduling form to choose your preferred date and arrival window. We'll review your request and confirm availability. No phone call needed.
        - generic [ref=e248]:
          - button "How much does an inspection cost? +" [ref=e249] [cursor=pointer]:
            - text: How much does an inspection cost?
            - generic [ref=e250]: +
          - generic:
            - paragraph: The inspection fee is $149, and it's credited toward the service if you proceed with recommended work. Repair pricing depends on what the inspection finds — every repair is scoped in writing before any work begins.
        - generic [ref=e251]:
          - button "Do you protect the inside of my home during service? +" [ref=e252] [cursor=pointer]:
            - text: Do you protect the inside of my home during service?
            - generic [ref=e253]: +
          - generic:
            - paragraph: Yes. We lay protective floor coverings, seal the fireplace opening during cleaning, and keep the work area organized. We leave your home as clean as we found it.
        - generic [ref=e254]:
          - button "What areas of Connecticut do you serve? +" [ref=e255] [cursor=pointer]:
            - text: What areas of Connecticut do you serve?
            - generic [ref=e256]: +
          - generic:
            - paragraph: We serve communities across Fairfield County, the greater Hartford area, and the Connecticut shoreline — including Greenwich, Darien, New Canaan, Westport, Stamford, West Hartford, Glastonbury, Madison, Guilford, and surrounding towns.
        - generic [ref=e257]:
          - button "What's included in a chimney inspection? +" [ref=e258] [cursor=pointer]:
            - text: What's included in a chimney inspection?
            - generic [ref=e259]: +
          - generic:
            - paragraph: Our inspections cover the chimney exterior, crown, cap, flashing, accessible flue liner, damper, smoke chamber, and firebox. You receive photos of any findings and a written summary in plain English.
